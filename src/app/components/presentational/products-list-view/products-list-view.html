<div class="list-container">
  <div class="list-header">
    <span class="col-category">Category</span>
    <span class="col-name">Product Name</span>
    <span class="col-price">Price</span>
    <span class="col-action"></span>
  </div>

  <div class="list-body">
    @for(product of products(); track product.id) {
      <div class="list-row">
        <span class="col-category">
          <span class="badge">{{ product.categoryName }}</span>
        </span>
        <span class="col-name fw-medium">{{ product.name }}</span>
        <span class="col-price">{{ product.price }} EUR</span>
        <span class="col-action">
          <button [routerLink]="['/products', product.id]" style="padding: 0.5rem 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff;">View</button>
          <button (click)="deleteProduct.emit(product.id)" style="padding: 0.5rem 1rem; cursor: pointer; border-radius: 6px; border: 1px solid #e2e8f0; background: #fff;">Delete</button>
        </span>
      </div>
    } @empty {
      <div class="empty-state">No products found.</div>
    }
  </div>
</div>
