<div class="list-container">
  <div class="list-header">
    <span class="col-category">Category</span>
    <span class="col-name">Product Name</span>
    <span class="col-price">Price</span>
    <span class="col-action"></span>
  </div>

  <div class="list-body">
    @for(product of products; track product.id) {
      <div class="list-row" (click)="onSelectProduct(product)">
        <span class="col-category">{{ product.category }}</span>
        <span class="col-name">{{ product.name }}</span>
        <span class="col-price">{{ product.price }} EUR</span>
        <span class="col-action icon-arrow">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </span>
      </div>
    } @empty {
      <div class="empty-state">No products found.</div>
    }
  </div>
</div>
