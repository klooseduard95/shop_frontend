<main>
  <h1>My Online Shop</h1>

  <section class="mb-3">
    <h2>Products catalog</h2>
    <app-products-list (productSelected)="onProductSelected($event)"></app-products-list>
  </section>

  <section>
    <h2>Product details</h2>
    <app-products-details [product]="selectedProduct()"></app-products-details>
  </section>

  <section class="mt-3">
    <app-shopping-cart-details></app-shopping-cart-details>
  </section>
</main>
